groups:
  - name: petclinic_slos
    rules:
      - alert: HighErrorRate
        expr: |
          (
            sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
            /
            sum(rate(http_server_requests_seconds_count[5m]))
          ) * 100 > 0.1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Alta tasa de errores (Caída de Disponibilidad)"
          description: "La tasa de errores HTTP 5xx supera el 0.1% en los últimos 5 minutos. El SLO de Disponibilidad está en riesgo."
          
      - alert: HighLatency
        expr: |
          histogram_quantile(0.99, sum by (le) (rate(http_server_requests_seconds_bucket[5m]))) * 1000 > 500
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Alta Latencia (P99)"
          description: "La latencia del percentil 99 ha superado los 500ms durante 5 minutos. El SLO de Latencia está en riesgo."
