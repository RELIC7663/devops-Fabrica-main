global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - 'alert.rules.yml'

scrape_configs:
  - job_name: 'petclinic'
    metrics_path: '/actuator/prometheus'
    scheme: https
    static_configs:
      - targets: ['proyecto-devops-ewfx.onrender.com']
        labels:
          app: petclinic
          environment: production

  - job_name: 'kubernetes-pods'
    kubernetes_sd_configs:
      - role: pod
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: true

